        <span></span><span></span><span></span>
      </button>

  <header class="page-hero">
    <div class="container">
      <p class="kicker">CLOVERS VOTE</p>
      <h1>投票</h1>
      <p class="hero-desc-sm">管理员发起，成员一人一票。开始前不可投，截止后自动结算。</p>
      <div class="vote-actions">
        <button class="btn btn-primary btn-sm" id="newPollBtn" type="button" hidden>发起投票</button>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div id="pollList">
        <p class="muted">加载中...</p>
      </div>
    </div>
  </main>

  <!-- 发起投票 -->
  <div class="modal-mask" id="pollModal">
    <div class="modal-box">
      <button class="modal-close" id="pollClose" type="button" aria-label="关闭">×</button>
      <h3>发起投票</h3>
      <form class="add-form" id="pollForm">
        <label>标题<input id="pollTitle" maxlength="160" required /></label>
        <label>说明（可选）<input id="pollDesc" maxlength="500" /></label>
        <label>选项（一行一个，2-10 个）<textarea id="pollOptions" rows="5" placeholder="选项一&#10;选项二&#10;选项三" required></textarea></label>
        <label>开始时间<input id="pollStart" type="datetime-local" /></label>
        <label>截止时间<input id="pollEnd" type="datetime-local" /></label>
        <button class="btn btn-primary btn-sm" type="submit">创建投票</button>
      </form>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <div class="footer-content">
        <div class="footer-brand">
